:root{color-scheme:light;
  --display:"PS WRC Clean","Lato",Arial,sans-serif;--body:"Open Sans",Arial,sans-serif;
  --bg:#f1f6f3;--ink:#2a2a2c;--ink-soft:#2e3d39;--on-gold:#1c1c1c;--placeholder:#5f7a72;--glitch-ink:#303033;--accent:#0f9e72;
  --hi:rgba(255,255,255,.35);--hi-strong:rgba(255,255,255,.5);
  --band-top:linear-gradient(#d9d9dc,#c8c8cc);
  --strip:linear-gradient(rgba(16,150,92,.95),rgba(0,122,124,.95));--strip-edge:rgba(0,48,40,.85);
  --cell:linear-gradient(rgba(234,246,241,.9),rgba(208,235,225,.9) 55%,rgba(178,220,205,.9));
  --cell-solid:linear-gradient(#e8f5ef,#cfe9de 55%,#b2dccd);
  --gold:linear-gradient(#fcbf2a,#f5a91c 60%,#e2900e);
  --drop:rgba(0,46,38,.55);--tile-edge:rgba(0,22,18,.85);
  --gloss:linear-gradient(118deg,rgba(255,255,255,.30),rgba(255,255,255,.04) 42%,rgba(255,255,255,0) 43%,rgba(0,0,0,.28))}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#1a2422;--ink:#e3f0eb;--ink-soft:#b8cec7;--placeholder:#8fa8a0;--glitch-ink:#dde8e4;--accent:#22b884;
  --hi:rgba(255,255,255,.07);--hi-strong:rgba(255,255,255,.12);
  --band-top:linear-gradient(#34333b,#2a2930);
  --strip:linear-gradient(rgba(12,122,78,.96),rgba(0,96,98,.96));--strip-edge:rgba(0,14,12,.9);
  --cell:linear-gradient(rgba(36,66,60,.92),rgba(28,54,50,.92) 55%,rgba(21,43,40,.92));
  --cell-solid:linear-gradient(#25443e,#1c3632 55%,#152b28);
  --drop:rgba(0,0,0,.6);--tile-edge:rgba(0,8,6,.9)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body);padding:0 0 10px;overflow-x:hidden}
button{font:inherit;color:inherit}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--strip);border-top:2px solid var(--strip-edge);border-bottom:2px solid var(--strip-edge);padding:8px 10px;margin-bottom:14px}
.bar .say{flex:1 1 220px;font:700 15px/1.25 var(--display);color:#fff;text-shadow:0 1px 0 rgba(0,30,24,.6);padding:0 4px}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;font:700 14.5px/1 var(--display);padding:10px 13px 9px;background:var(--cell-solid);color:var(--ink);box-shadow:0 4px 0 var(--drop),inset 0 2px 0 var(--hi-strong);white-space:nowrap}
.btn:hover{background:var(--gold);color:var(--on-gold)}
.btn.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 var(--drop),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.gold:hover{filter:brightness(1.06)}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn:focus-visible,.it:focus-visible{outline:3px solid #fcbf2a;outline-offset:2px}

.board{display:flex;flex-direction:column;gap:10px;--th:96px;--tw:138px;--ch:21px}
.tier{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px}
.tlab{background:linear-gradient(var(--c1),var(--c2));color:var(--ti);box-shadow:0 5px 0 var(--drop),inset 0 2px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font:700 var(--ls,40px)/1.05 var(--display);overflow-wrap:anywhere;min-height:calc(var(--th) + var(--ch) + 18px)}
.tlab.light-ink{text-shadow:0 2px 0 rgba(0,0,0,.35)}
.drop{background:var(--cell);box-shadow:0 5px 0 var(--drop),inset 0 2px 0 var(--hi);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:9px;min-height:calc(var(--th) + var(--ch) + 18px)}
.drop.over{outline:3px solid #fcbf2a;outline-offset:-3px}
.drop:empty::before{content:attr(data-hint);color:var(--placeholder);font:700 14px/1.3 var(--display);align-self:center;padding:0 6px;pointer-events:none}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--band-top);border-left:8px solid var(--accent);box-shadow:0 5px 0 var(--drop),inset 0 2px 0 var(--hi-strong);padding:10px 14px 8px;margin:22px 0 14px}
.phead h2{margin:0;font:700 22px/1.1 var(--display);color:var(--glitch-ink)}
.phead span{font:700 13px/1.2 var(--display);color:var(--ink-soft)}

.it{width:var(--tw);display:flex;flex-direction:column;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.it .tile{position:relative;height:var(--th);overflow:hidden;background:#202024;box-shadow:0 4px 0 var(--drop)}
.it .tile img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;display:block}
.it .tile::after{content:"";position:absolute;inset:0;background:var(--gloss);pointer-events:none;box-shadow:inset 0 0 0 2px var(--tile-edge)}
.it .cap{height:var(--ch);margin-top:4px;background:var(--cell-solid);box-shadow:0 3px 0 var(--drop),inset 0 2px 0 var(--hi-strong);font:700 12px/var(--ch) var(--display);text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board.nocap{--ch:0px}.board.nocap .cap{display:none}
.it.ph{opacity:.35}.it.ph .tile{outline:2px dashed #fcbf2a;outline-offset:2px}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(-3deg) scale(1.06);filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
body.dragging,body.dragging *{cursor:grabbing!important}

dialog{border:0;padding:0;width:min(440px,calc(100vw - 24px));background:var(--cell-solid);color:var(--ink);box-shadow:0 8px 0 var(--drop),0 20px 50px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,20,18,.55)}
.dh{background:var(--band-top);border-left:8px solid var(--accent);padding:12px 14px 9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dh h2{margin:0;font:700 20px/1.15 var(--display);color:var(--glitch-ink);overflow-wrap:anywhere}
.db{padding:14px;display:flex;flex-direction:column;gap:12px}
.db img{width:100%;aspect-ratio:1.44;object-fit:cover;box-shadow:0 4px 0 var(--drop)}
.lab{font:700 12.5px/1 var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
.mv{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--gold);color:var(--on-gold);font:700 14px/1 var(--display);padding:11px 14px;box-shadow:0 5px 0 var(--drop);z-index:2000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

@media (max-width:640px){
  .tier{grid-template-columns:70px minmax(0,1fr);gap:4px}
  .tlab{--ls:24px!important;padding:5px}
  .drop{padding:6px;gap:6px}
  .it .cap{font-size:10px;padding:0 2px}
  .bar .say{font-size:14px}
}
</style>
</head>

</div>
<div class="board" id="board">

</dialog>

  var n=0;R.tiers.forEach(function(a){n+=a.length;});if(!n){toast('Drag a few into the rows first');return;}
  var b=this,lab=b.querySelector('span');lab.textContent='Drawing…';b.disabled=true;
  picture().then(function(blob){
    var name='my-'+slug(DATA.title)+'.jpg';
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);toast('Saved '+name);
  }).catch(function(){toast('Could not make the picture');}).then(function(){lab.textContent='Download my tier list';b.disabled=false;});
});

/* ---------- follow the site's light / dark switch, and tell the article how tall this is ---------- */
try{var P0=parent;if(P0!==window){new MutationObserver(function(){var t=P0.document.documentElement.getAttribute('data-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}).observe(P0.document.documentElement,{attributes:true,attributeFilter:['data-theme']});}}catch(e){}
function tell(){try{if(parent!==window)parent.postMessage({pwEmbedHeight:document.documentElement.scrollHeight},'*');}catch(e){}}
var lastW=0;function onResize(){var w=document.documentElement.clientWidth;if(w!==lastW&&!D){lastW=w;render();}tell();}
render();lastW=document.documentElement.clientWidth;tell();
addEventListener('load',tell);addEventListener('resize',onResize);
try{new ResizeObserver(tell).observe(document.body);}catch(e){}
})();
</script>
<script>(function(){function s(){var b=document.body,c=getComputedStyle(b);parent.postMessage({pwEmbedHeight:b.scrollHeight+parseFloat(c.marginTop)+parseFloat(c.marginBottom)},'*')}addEventListener('load',s);new ResizeObserver(s).observe(document.body);s()})()</script></body>
