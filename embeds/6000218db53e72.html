  body,html{margin:0;padding:0;height:100%;font-family:'WRC Clean Roman',sans-serif;background:#1c1c1c;overflow:hidden;}
  #map{width:100%;height:100%;background:#0a0a0a;}
  /* Dark basemap: OSM raster tiles inverted in CSS. CARTO's dark_all now
     stamps 'API KEY REQUIRED' over keyless requests, so we build the black
     style locally instead of depending on a keyed tile service. sepia+hue-rotate
     collapses the map to a single navy hue so no stray greens survive. */
  .leaflet-layer.dark-basemap-tiles { filter: invert(1) sepia(1) hue-rotate(170deg) saturate(.75) brightness(.72) contrast(1.1); }

  .leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#666!important;}
  .leaflet-control-zoom a{background:#222!important;color:#aaa!important;border-color:#333!important;}
  #ch{position:absolute;z-index:9999;pointer-events:none;display:none;flex-direction:column;align-items:center;transform:translate(-50%,calc(-100% - 14px));}
  #ch .b{background:rgba(15,15,15,.97);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;max-width:180px;white-space:normal;box-shadow:0 4px 16px rgba(0,0,0,.8);}
  #ch .t{font-weight:700;font-size:12px;margin-bottom:3px;font-family:'WRC Clean Bold',sans-serif;}
  #ch .d{font-size:11px;color:#aaa;line-height:1.3;margin-bottom:4px;}
  #ch .m{font-size:11px;color:#888;}
  #ch .m span{color:#02dacd;font-weight:700;}
  #ch .l{width:2px;height:14px;}
  .leaflet-tooltip.poi-tt{background:rgba(15,15,15,.97);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;color:#fff;font-family:'WRC Clean Roman',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.8);pointer-events:none;max-width:180px;white-space:normal;width:180px;}
  .leaflet-tooltip.poi-tt::before{display:none;}
  .poi-tt .t{font-weight:700;font-size:12px;margin-bottom:3px;font-family:'WRC Clean Bold',sans-serif;}
  .poi-tt .d{font-size:11px;color:#aaa;line-height:1.3;margin-bottom:4px;}
  .poi-tt .m{font-size:11px;color:#888;}
  .poi-tt .m span{color:#02dacd;font-weight:700;}
  @media(max-width:600px){
    #ch .b{max-width:140px;padding:6px 8px;}
    #ch .t{font-size:11px!important;}#ch .d{font-size:10px!important;}#ch .m{font-size:10px!important;}
    .leaflet-tooltip.poi-tt{max-width:140px;width:140px;padding:6px 8px;}
    .poi-tt .t{font-size:11px;}.poi-tt .d{font-size:10px;}.poi-tt .m{font-size:10px;}
  }
.leaflet-popup.poi-tt .leaflet-popup-content-wrapper { background:rgba(15,15,15,.97); border:1px solid rgba(255,255,255,.12); border-radius:6px; padding:8px; color:#fff; box-shadow:0 4px 16px rgba(0,0,0,.8); }
.leaflet-popup.poi-tt .leaflet-popup-tip-container { margin-top:-1px; }
.leaflet-popup.poi-tt .leaflet-popup-tip { background:rgba(15,15,15,.97); border:1px solid rgba(255,255,255,.12); border-top:none; border-left:none; }
.leaflet-popup.poi-tt .leaflet-popup-content { margin:0 !important; line-height:1.4; width:160px !important; font-family:'WRC Clean Roman',sans-serif; }
@media(max-width:600px){ .leaflet-popup.poi-tt .leaflet-popup-content { width:140px !important; } }

  .map-style-switcher { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 4px; background: rgba(0,0,0,0.55); padding: 5px; border-radius: 8px; }
  .map-style-btn { background: #333; color: #ccc; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; font-family: 'WRC Clean Roman', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; white-space:nowrap; }
  .map-style-btn.active { background: #fc4d03; border-color: #fc4d03; color: #fff; }
  @media(max-width:600px){
    .map-style-switcher { top:8px; right:8px; gap:3px; padding:3px; }
    .map-style-btn { padding:4px 6px; font-size:9px; border-radius:4px; }
  }
  @media(max-width:400px){
    .map-style-switcher { gap:2px; padding:2px; }
    .map-style-btn { padding:3px 5px; font-size:8px; }
  }
  /* Full screen control - shares the top-right cluster with the basemap buttons */
  .map-fs-btn { display:flex; align-items:center; justify-content:center; padding:5px 8px; }
  .map-fs-btn:hover { background:#444; color:#fff; }
  .map-fs-btn.active { background:#fc4d03; border-color:#fc4d03; color:#fff; }
  .map-fs-btn svg { display:block; }
  @media(max-width:600px){ .map-fs-btn { padding:4px 6px; } }
  @media(max-width:400px){ .map-fs-btn { padding:3px 5px; } }

  /* ---- Click callout ----

<script>
/* Snapshot of this page exactly as it was served, taken before Leaflet touches the DOM.
   The fullscreen fallback re-writes it into a new tab when the host frame blocks the
   Fullscreen API, which is the only way to get a real full-window map out of a Google
   Sites embed - there our own location is Google's wrapper frame, not this file. */
const PAGE_SRC='<!DOCTYPE html>'+document.documentElement.outerHTML;
const map=L.map('map',{zoomControl:true,scrollWheelZoom:true,tap: true,preferCanvas:true}).setView([0,0],2);
const mapTileStyles = {
  dark: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19,className:'dark-basemap-tiles'}),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19}),
  plain: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19})
};
let currentMapStyle = 'dark';
mapTileStyles[currentMapStyle].addTo(map);
// the active pill is baked in at export time; re-sync it so a rebuilt copy of this
// page (see PAGE_SRC) highlights whichever basemap it actually opened with
document.querySelectorAll('#map-style-switcher .map-style-btn[data-style]').forEach(function(b){ b.classList.toggle('active', b.dataset.style===currentMapStyle); });
function setMapStyle(styleName){
  if(!mapTileStyles[styleName] || styleName===currentMapStyle) return;
  map.removeLayer(mapTileStyles[currentMapStyle]);
  currentMapStyle = styleName;
  mapTileStyles[currentMapStyle].addTo(map);
  document.querySelectorAll('#map-style-switcher .map-style-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.style===styleName);
  });
}
function decodePath(str){
  const pts=[]; let i=0, lat=0, lng=0;
  while(i<str.length){
    let b, shift=0, res=0;
    do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lat += (res&1)?~(res>>1):(res>>1);
    shift=0; res=0;
    do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lng += (res&1)?~(res>>1):(res>>1);
    pts.push({lat:lat/1e5, lng:lng/1e5});
  }
  return pts;

function poiPinHtml(key,dim){
  const ic=POI_ICONS[key]||POI_ICONS.spot;
  return '<div class="poi-pin" style="--pc:'+ic.color+';opacity:'+(dim?'0.72':'1')+'">'
    +'<span class="poi-fx"></span>'
    +'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="'+ic.color+'" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="color:'+ic.color+'">'+ic.path+'</svg></div>';
}
/* ---- Callout ----
   Shared by points and sectors: a leader line grows out of the anchor at an angle and a
   panel unfolds at the end of it, the way a spot is annotated on a recce note. The anchor
   is a lat/lng, so it re-pins on every map move and the panel tracks what it describes.
   For a point that anchor is the pin; for a sector it is wherever the line was clicked. */
let pcKey=null, pcAnchor=null, pcPin=null, pcOnClose=null, pcPinned=false, pcHideT=0;
function pcEls(){
  const root=document.getElementById('poi-callout');
  return {root:root, line:root.querySelector('.pc-line'), dot:root.querySelector('.pc-dot'), box:root.querySelector('.pc-box')};
}
window.calloutKey=function(){ return pcKey; };
window.calloutPinned=function(){ return pcPinned; };
/* Hovering shows a callout; clicking pins it so the cursor can travel to the panel and
   press Watch video. The small delay on hide is what lets you cross the gap between the
   road and the panel, and what stops a flicker when sweeping across adjacent sectors. */
/* Leaflet fires [layer, map] in one pass for canvas-rendered lines and only checks its
   own _stopped flag between them. Native stopPropagation does not set that flag, so the
   map's click ran straight after the sector's and shut the callout again - invisible on
   desktop because hover kept it up, fatal on touch where there is no hover. */
let pcOpenedAt=0;
window.stopMapClick=function(e){
  const oe=e&&e.originalEvent;
  if(!oe) return;
  oe._stopped=true;                 // stops the map target later in the same pass
  L.DomEvent.stopPropagation(oe);   // stops it bubbling to the container handler
};
window.calloutHold=function(){ clearTimeout(pcHideT); };
window.calloutRelease=function(){
  clearTimeout(pcHideT);
  pcHideT=setTimeout(function(){ if(!pcPinned) closeCallout(); }, 320);
};
function placeCallout(){
  if(!pcAnchor) return;
  const {root,line,dot,box}=pcEls();
  const size=map.getSize();
  const p=map.latLngToContainerPoint(pcAnchor);
  const len=(size.x<520||size.y<420)?74:104;
  const bw=box.offsetWidth||210, bh=box.offsetHeight||120;
  // point away from the nearest edge so the panel always lands on the map
  const dx=(p.x>size.x-(bw+len))?-1:1;
  const dy=(p.y<bh+len+16)?1:-1;
  const rad=42*Math.PI/180;
  const ex=p.x+dx*len*Math.cos(rad), ey=p.y+dy*len*Math.sin(rad);
  root.style.setProperty('--len',len+'px');
  line.style.left=p.x+'px'; line.style.top=p.y+'px';
  line.style.transform='rotate('+(Math.atan2(ey-p.y,ex-p.x)*180/Math.PI).toFixed(2)+'deg)';
  dot.style.left=ex+'px'; dot.style.top=ey+'px';
  let bx=(dx>0)?ex-6:ex-bw+6;
  let by=(dy<0)?ey-bh+6:ey-6;
  bx=Math.max(6,Math.min(bx,size.x-bw-6));
  by=Math.max(6,Math.min(by,size.y-bh-6));
  box.style.left=bx+'px'; box.style.top=by+'px';
  box.style.transformOrigin=((dx>0)?'0':'100%')+' '+((dy<0)?'100%':'0');
}
/* key   - identifies what is being described, so clicking the same thing closes it
   at    - [lat,lng] the line grows from
   d     - {color,title,desc,metaHtml,photo,video,videoTitle}
   opts  - {pin: element to mark as open, onClose: fn} */
window.openCallout=function(key, at, d, opts){
  opts=opts||{};
  const wantPin=!!opts.pinned;
  clearTimeout(pcHideT);
  if(pcKey===key){                      // already describing this - a click just pins it
    if(wantPin){ pcPinned=true; pcOpenedAt=Date.now(); }
    return;
  }
  if(pcPinned && !wantPin) return;      // a pinned callout is not stolen by a passing hover
  closeCallout();
  const {root,box}=pcEls();
  pcKey=key; pcAnchor=at; pcPin=opts.pin||null; pcOnClose=opts.onClose||null; pcPinned=wantPin; pcOpenedAt=Date.now();
  const vid=ytId(d.video);
  root.style.setProperty('--pc',d.color);
  box.innerHTML=(d.photo?'<img src="'+d.photo+'" alt="">':'')
    +'<button class="pc-x" type="button" title="Close">&#10005;</button>'
    +'<div class="pc-in"><div class="pc-t" style="color:'+d.color+'">'+d.title+'</div>'
    +(d.desc?'<div class="pc-d">'+d.desc+'</div>':'')
    +'<div class="pc-m">'+d.metaHtml+'</div>'
    +(vid?watchBtnHtml(vid,d.videoTitle||d.title):'')+'</div>';
  box.querySelector('.pc-x').addEventListener('click',function(e){ e.stopPropagation(); closeCallout(); });
  box.addEventListener('click',function(e){ e.stopPropagation(); });
  if(pcPin) pcPin.classList.add('is-open');
  root.classList.add('on');
  placeCallout();
  void root.offsetWidth;                              // let the zero-length line paint first
  root.classList.add('show');
  placeCallout();                                     // re-measure once the panel has content
};
window.closeCallout=function(){
  const {root}=pcEls();
  root.classList.remove('show','on');
  if(pcPin) pcPin.classList.remove('is-open');
  const cb=pcOnClose;
  clearTimeout(pcHideT);
  pcKey=null; pcAnchor=null; pcPin=null; pcOnClose=null; pcPinned=false;
  if(cb) cb();
};
(function(){
  const e=pcEls();
  [e.box, e.line].forEach(function(el){
    el.addEventListener('mouseenter', calloutHold);
    el.addEventListener('mouseleave', calloutRelease);
  });
  e.line.addEventListener('click', function(ev){ ev.stopPropagation(); pcPinned=true; });
})();
map.on('move zoom resize', placeCallout);
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeCallout(); });
function poiDivIcon(key,dim){return L.divIcon({className:'',html:poiPinHtml(key,dim),iconSize:[20,20],iconAnchor:[10,10]});}
function ytId(url){
  const s=String(url==null?'':url).trim();
  if(!s) return '';
  const m=s.match(/(?:youtube\.com\/(?:watch\?(?:[^&]*&)*v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return '';
}
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function watchBtnHtml(id, title){
  return '<button class="mp-watch" data-yt="'+id+'" data-t="'+escAttr(title)+'" onclick="openMiniPlayer(this.getAttribute(\'data-yt\'),this.getAttribute(\'data-t\'))">&#9654; Watch video</button>';
}
/* YouTube refuses to start inside a page with an opaque origin, which is what you get
   when the file is opened straight from disk (file://). Fall back to a click-through
   there; embed normally once the page is served over http(s). */
const YT_CAN_EMBED = (location.protocol==='http:' || location.protocol==='https:');
window.openMiniPlayer=function(id, title){
  if(!id) return;
  const p=document.getElementById('mini-player');
  const watch='https://www.youtube.com/watch?v='+id;
  document.getElementById('mp-title').textContent=title||'Video';
  document.getElementById('mp-open').href=watch;
  const body=document.getElementById('mp-body');
  if(YT_CAN_EMBED){
    body.innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&amp;rel=0&amp;playsinline=1&amp;controls=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"><\/iframe>';
  } else {
    body.innerHTML='<a class="mp-fallback" href="'+watch+'" target="_blank" rel="noopener noreferrer">'
      +'<img src="https://i.ytimg.com/vi/'+id+'/mqdefault.jpg" alt="" onerror="this.style.display=\'none\'">'
      +'<span class="mp-fplay"></span>'
      +'<span class="mp-fnote">Opens on YouTube &mdash; in-page playback works once this map is online</span></a>';
  }
  p.classList.add('open');
};
window.closeMiniPlayer=function(){
  const p=document.getElementById('mini-player');
  p.classList.remove('open');
  document.getElementById('mp-body').innerHTML=''; // unloading the iframe stops playback
};
(function initMiniPlayer(){
  const p=document.getElementById('mini-player'), bar=document.getElementById('mp-bar');
  document.getElementById('mp-close').addEventListener('click', closeMiniPlayer);
  document.getElementById('mp-size').addEventListener('click', ()=>p.classList.toggle('lg'));
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMiniPlayer(); });
  let sx=0, sy=0, ox=0, oy=0, dragging=false;
  const down=(x,y)=>{
    const r=p.getBoundingClientRect();
    // switch from right-anchored to left/top so dragging is absolute
    p.style.left=r.left+'px'; p.style.top=r.top+'px'; p.style.right='auto';
    sx=x; sy=y; ox=r.left; oy=r.top; dragging=true;
  };
  const move=(x,y)=>{
    if(!dragging) return;
    const r=p.getBoundingClientRect();
    const nx=Math.min(Math.max(0, ox+(x-sx)), window.innerWidth - r.width);
    const ny=Math.min(Math.max(0, oy+(y-sy)), window.innerHeight - r.height);
    p.style.left=nx+'px'; p.style.top=ny+'px';
  };
  const up=()=>{ dragging=false; };
  bar.addEventListener('mousedown', e=>{ if(e.target.tagName==='BUTTON') return; e.preventDefault(); down(e.clientX,e.clientY); });
  window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
  window.addEventListener('mouseup', up);
  bar.addEventListener('touchstart', e=>{ if(e.target.tagName==='BUTTON') return; const t=e.touches[0]; down(t.clientX,t.clientY); }, {passive:true});
  window.addEventListener('touchmove', e=>{ if(dragging && e.cancelable) e.preventDefault(); const t=e.touches[0]; if(t) move(t.clientX,t.clientY); }, {passive:false});
  window.addEventListener('touchend', up);
})();
function routeAngle(a,b){const p1=map.project(a,18),p2=map.project(b,18);return Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI;}
function splitTickIcon(a,b){
  return L.divIcon({className:'',html:'<div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;transform:rotate('+routeAngle(a,b).toFixed(1)+'deg)"><div style="width:3.5px;height:15px;background:#141414;border-radius:1px;box-shadow:0 0 0 1.5px rgba(255,255,255,.95)"></div></div>',iconSize:[20,20],iconAnchor:[10,10]});
}
const bounds=L.latLngBounds();
const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
let fullCoords=[],cumDist=[0];
sectors.forEach(sec=>{sec.coords.forEach((c,i)=>{if(i===0&&fullCoords.length>0)return;fullCoords.push(c);});});
let tDist=0;
function gd(a,b,c,d){const R=6371,dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
for(let i=1;i<fullCoords.length;i++){tDist+=gd(fullCoords[i-1].lat,fullCoords[i-1].lng,fullCoords[i].lat,fullCoords[i].lng);cumDist.push(tDist);}

let selId=null,sLayers={};
map.on('click',()=>{ if(map._popup) map.closePopup(); if(Date.now()-pcOpenedAt<80) return; closeCallout(); sel(null); });
function sel(id){selId=id;sectors.forEach((sec,i)=>{const l=sLayers[i];if(!l)return;const on=(id===null||id===i);if(id===i){l.glow.setStyle({weight:10,opacity:1});l.core.setStyle({weight:4,opacity:1});l.glow.bringToFront();l.core.bringToFront();}else{l.glow.setStyle({weight:7.5,opacity:on?0.9:0.3});l.core.setStyle({weight:3,opacity:on?1:0.35});}}); if(window.poiMarkers) window.poiMarkers.forEach(m=>{if(m.bringToFront)m.bringToFront();});}

const mkI=h=>L.divIcon({className:'',html:h,iconSize:[18,18],iconAnchor:[9,9]});
const mkSm=h=>L.divIcon({className:'',html:h,iconSize:[14,14],iconAnchor:[7,7]});

// We trace stages by looking for id===0
let currentStageSectors = [];
const stageGroups = []; // {label, bounds, dist}
const drawSF = (stageSecs, isMain) => {
  if(!stageSecs.length) return;
  const sPt = stageSecs[0].coords[0];
  const fPt = stageSecs[stageSecs.length-1].coords[stageSecs[stageSecs.length-1].coords.length-1];
  const stageLabel = stageSecs[0].stageLabel || stageSecs[0].name || 'Stage';
  const labelIcon=L.divIcon({className:'stage-label',html:'<div style="display:inline-block;overflow:visible;background:rgba(10,10,10,.9);color:#fff;border-left:3px solid #fc4d03;border-radius:2px;padding:3px 6px;white-space:nowrap;font-family:WRC Clean Bold,sans-serif;font-size:10px;box-shadow:0 2px 5px rgba(0,0,0,.55)">'+stageLabel+'</div>',iconSize:[300,28],iconAnchor:[-13,34]});
  L.marker(sPt,{icon:labelIcon,interactive:false,zIndexOffset:850}).addTo(map);

  if (isMain) {
    L.marker(sPt,{icon:mkI('<div style="background:#4caf50;color:#fff;width:18px;height:18px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;box-shadow:0 0 8px rgba(0,0,0,.6)">S</div>'),interactive:false,zIndexOffset:1000}).addTo(map);
    L.marker(fPt,{icon:mkI('<div style="background:#fff;color:#000;width:18px;height:18px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 0 8px rgba(0,0,0,.6)">🏁</div>'),interactive:false,zIndexOffset:1000}).addTo(map);
  } else {
    L.marker(sPt,{icon:mkSm('<div style="background:#4caf50;color:#fff;width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:bold;opacity:0.8">S</div>'),interactive:false,zIndexOffset:900}).addTo(map);
    L.marker(fPt,{icon:mkSm('<div style="background:#fff;color:#000;width:14px;height:14px;border-radius:50%;border:1.5px solid #000;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:bold;opacity:0.8">🏁</div>'),interactive:false,zIndexOffset:900}).addTo(map);
  }

  const gBounds = L.latLngBounds();
  stageSecs.forEach(sec=>sec.coords.forEach(c=>gBounds.extend([c.lat,c.lng])));
  const gIdx = stageGroups.length;
  stageSecs.forEach(sec=>{ sec.__stageIdx = gIdx; });
  stageSecs[0].__isStageStart = true; // no split tick here — the S marker owns this point
  stageGroups.push({label: stageLabel, bounds: gBounds, dist: stageSecs.reduce((n,s)=>n+(parseFloat(s.dist)||0),0)});
};

let isFirstStage = true;
sectors.forEach(sec => {
  if (sec.id === 0 && currentStageSectors.length > 0) {
    drawSF(currentStageSectors, isFirstStage);
    isFirstStage = false;
    currentStageSectors = [];
  }
  currentStageSectors.push(sec);
});
if(currentStageSectors.length > 0) drawSF(currentStageSectors, isFirstStage);
const stageLayerGroups = stageGroups.map(()=>[]);

sectors.forEach((sec,si)=>{
  const ll=sec.coords.map(p=>[p.lat,p.lng]);ll.forEach(x=>bounds.extend(x));
  const glow=L.polyline(ll,{color:sec.color,weight:7.5,opacity:0.9,lineCap:'round',lineJoin:'round',interactive:false,smoothFactor:3.0}).addTo(map);
  const core=L.polyline(ll,{color:'#fff',weight:3,opacity:1,lineCap:'round',lineJoin:'round',interactive:false,smoothFactor:2.0}).addTo(map);
  const hit=L.polyline(ll,{color:'transparent',weight:30,opacity:0,lineCap:'round',lineJoin:'round',interactive:true,smoothFactor:2.0}).addTo(map);
  sLayers[si]={core,glow,hit};
  if(sec.__stageIdx!==undefined && stageLayerGroups[sec.__stageIdx]) stageLayerGroups[sec.__stageIdx].push({core,glow});
  const secVid = ytId(sec.video);
  const secData={ color:sec.color, title:sec.name, desc:sec.desc,
    metaHtml:'Length <span>'+sec.dist+' km</span>', photo:sec.photo, video:sec.video, videoTitle:sec.name };
  if(!isTouch){
    // The line is anchored where the cursor entered the road and stays put while you
    // read it - following the cursor would drag the panel around under your eyes.
    hit.on('mouseover',e=>{
      if(selId!==si){glow.setStyle({weight:10,opacity:1});core.setStyle({weight:4});}
      calloutHold();
      openCallout('sec'+si, e.latlng || core.getBounds().getCenter(), secData, {});
    });
    hit.on('mouseout',()=>{
      if(selId!==si){glow.setStyle({weight:7.5,opacity:(selId===null)?0.9:0.3});core.setStyle({weight:3});}
      calloutRelease();
    });
  }
  hit.on('click',e=>{
    stopMapClick(e);
    if(calloutKey()==='sec'+si && calloutPinned()){ closeCallout(); return; }
    sel(si);
    if(!isTouch) map.fitBounds(core.getBounds(),{padding:[20,20]});
    openCallout('sec'+si, e.latlng || core.getBounds().getCenter(), secData,
                {pinned:true, onClose:function(){ sel(null); }});
  });
  if(!sec.__isStageStart&&ll.length>1)L.marker(ll[0],{icon:splitTickIcon(ll[0],ll[Math.min(3,ll.length-1)]),interactive:false,zIndexOffset:600}).addTo(map);
});
window.poiMarkers=[];
pois.forEach((poi,pi)=>{
  const pt = [poi.lat, poi.lng];
  const mk=L.marker(pt,{icon:poiDivIcon(poi.icon,poi.isMerged),zIndexOffset:poi.isMerged?650:700}).addTo(map); window.poiMarkers.push(mk);
  const pic=POI_ICONS[poi.icon]||POI_ICONS.spot;
  const poiData={ color:pic.color, title:poi.title, desc:poi.desc,
    metaHtml:'Mark <span>'+poi.km+' km</span>', photo:poi.photo, video:poi.video, videoTitle:poi.title };
  const poiPin=()=>{ const el=mk.getElement(); return el?el.querySelector('.poi-pin'):null; };
  if(!isTouch){
    mk.on('mouseover',function(){ calloutHold(); openCallout('poi'+pi,[poi.lat,poi.lng],poiData,{pin:poiPin()}); });
    mk.on('mouseout', calloutRelease);
  }
  mk.on('click',function(e){
    stopMapClick(e);
    if(calloutKey()==='poi'+pi && calloutPinned()){ closeCallout(); return; }
    openCallout('poi'+pi,[poi.lat,poi.lng],poiData,{pin:poiPin(), pinned:true});
  });
});
if(sectors.length>0)map.fitBounds(bounds,{padding:[20,20]});

if(stageGroups.length>1){
  const switcher=document.getElementById('stage-switcher');
  const infoBox=document.getElementById('stage-info');
  const infoTitle=infoBox.querySelector('.title'),infoFacts=infoBox.querySelector('.facts');
  const swapInfo=(html)=>{
    infoBox.classList.add('fade-swap');
    setTimeout(()=>{ infoTitle.innerHTML=html.title; infoFacts.innerHTML=html.facts; infoBox.classList.remove('fade-swap'); },180);
  };
  const setActive=(idx)=>{
    switcher.querySelectorAll('.stage-tab').forEach((btn,i)=>btn.classList.toggle('active', i===(idx===null?0:idx+1)));
    stageLayerGroups.forEach((layers,i)=>{
      const on = idx===null || i===idx;
      layers.forEach(({core,glow})=>{ core.setStyle({weight:on?4:3,opacity:on?1:0.3}); glow.setStyle({weight:on?10:7.5,opacity:on?1:0.28}); });
    });
    if(idx===null){
      swapInfo({title:"SS4/7 · Monti die Alà - Sa Conchedda - Lerno",facts:'<span class="fact">'+stageMeta.distance+' km</span><span class="fact surface">'+stageGroups.length+' stages</span>'});
      map.flyToBounds(bounds,{padding:[20,20],duration:1.1,easeLinearity:0.25});
    } else {
      const g=stageGroups[idx];
      swapInfo({title:g.label,facts:'<span class="fact">'+g.dist.toFixed(2)+' km</span>'});
      map.flyToBounds(g.bounds,{padding:[40,40],duration:1.1,easeLinearity:0.25});
    }
  };
  const allBtn=document.createElement('button'); allBtn.type='button'; allBtn.className='stage-tab active'; allBtn.textContent='Overview'; allBtn.onclick=()=>setActive(null);
  switcher.appendChild(allBtn);
  stageGroups.forEach((g,i)=>{
    const btn=document.createElement('button'); btn.type='button'; btn.className='stage-tab'; btn.textContent=g.label; btn.onclick=()=>setActive(i);
    switcher.appendChild(btn);
  });
  switcher.style.display='flex';
  document.body.classList.add('has-switcher'); // lifts #stage-links clear of the tab bar
}

/* ---- Full screen ----
   Inside an iframe the Fullscreen API only works when the embedding <iframe> carries
   allow="fullscreen" (or allowfullscreen). Google Sites' embed wrapper does not always
   pass that through, and iOS Safari has no element fullscreen at all, so when the API is
   blocked we fall back to opening this map at top level in a new tab. */
(function initFullscreen(){
  const btn=document.getElementById('fs-btn');
  if(!btn) return;
  const ICON_IN='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const ICON_OUT='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  const root=document.documentElement;
  const req=root.requestFullscreen||root.webkitRequestFullscreen||root.webkitRequestFullScreen||root.msRequestFullscreen;
  const exitFs=document.exitFullscreen||document.webkitExitFullscreen||document.webkitCancelFullScreen||document.msExitFullscreen;
  const flag=(document.fullscreenEnabled!==undefined)?document.fullscreenEnabled:document.webkitFullscreenEnabled;
  const canFS=!!req && flag!==false;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement||null;
  let toastT=0;
  function toast(msg){
    let t=document.getElementById('fs-toast');
    if(!t){ t=document.createElement('div'); t.id='fs-toast'; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},4500);
  }
  function paint(){
    const on=!!fsEl();
    btn.innerHTML=on?ICON_OUT:ICON_IN;
    btn.title=on?'Exit full screen':(canFS?'Full screen':'Open full screen in a new tab');
    btn.setAttribute('aria-label',btn.title);
    btn.classList.toggle('active',on);
    setTimeout(function(){map.invalidateSize();},150); // the map box just changed size
  }
  /* Our own URL is only worth reopening when this file really is the framed document.
     Inside a Google Sites embed we are running in Google's gadget wrapper, so its URL
     would open an empty shell - detect that and rebuild the map from PAGE_SRC instead. */
  function ownUrl(){
    try{
      if(location.protocol!=='http:'&&location.protocol!=='https:') return '';
      const host=(location.hostname||'').toLowerCase(), path=(location.pathname||'').toLowerCase();
      if(host.indexOf('googleusercontent.com')>-1) return '';   // Google Sites' gadget wrapper
      if(path.indexOf('/embed/')>-1||path.indexOf('/embeds/')>-1) return '';
      return location.href;
    }catch(_){ return ''; }
  }
  function writeSelfInto(w){
    let src=PAGE_SRC;
    // carry the basemap the viewer is actually looking at into the new tab
    try{ src=src.replace(/let currentMapStyle = '[a-z]+';/, "let currentMapStyle = '"+currentMapStyle+"';"); }catch(_){}
    w.document.open(); w.document.write(src); w.document.close();
  }
  function openTopLevel(){
    const url=ownUrl();
    let w=null;
    try{ w=window.open(url||'','_blank'); }catch(_){}
    if(!w){ toast('Allow pop-ups for this page to open the map full screen.'); return; }
    if(url) return;                       // the real file will load on its own
    try{ writeSelfInto(w); }
    catch(_){ try{ w.close(); }catch(__){} toast('This page could not open the map in a new tab.'); }
  }
  btn.addEventListener('click',function(e){
    e.preventDefault();
    if(fsEl()){ try{ exitFs.call(document); }catch(_){} return; }
    if(!canFS){ openTopLevel(); return; }
    let p;
    try{ p=req.call(root,{navigationUI:'hide'}); }catch(_){ openTopLevel(); return; }
    if(p&&typeof p.catch==='function') p.catch(openTopLevel);
  });
  ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(ev){document.addEventListener(ev,paint);});
  paint();
})();
</script></body></html>
