const paceDist=Object.values(distMap).map(d=>{const pcts={};Object.keys(d.counts).forEach(k=>{pcts[k]=d.n>0?+(d.counts[k]/d.n).toFixed(4):0;});return{rank:d.rank,n:d.n,counts:d.counts,pcts};});return{rallyRows,seasonSummary:Object.values(seasonMap).sort((a,b)=>a.year-b.year),paceDist,currentYear:Math.max(...Object.keys(seasonMap).map(Number))};}
let _tab='dist',_ssSort={k:'year',asc:false},_rdSort={k:'_idx',asc:true},_barChart=null,_lineChart=null,_data=null;
window.pvrInit=function(){_data=computePVR();_data.rallyRows.forEach((r,i)=>{r._idx=i;});_populateRallyFilters();_buildHeatTable();_buildSeasonTable();_buildBarChart();_buildLineChart();pvrSetTab(_tab);pvrRenderRallyTable();_updateStatBar();};
function _st(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
function _updateStatBar(){const t=_data.rallyRows.length,w=_data.rallyRows.filter(r=>r.result==='Win').length,p=_data.rallyRows.filter(r=>r.result==='Win'||r.result==='Podium').length,n=_data.rallyRows.filter(r=>r.result==='No Score').length,yrs=_data.seasonSummary.map(s=>s.year);_st('pvrStatTotal',t);_st('pvrStatWins',w);_st('pvrStatWinRate',(w/t*100).toFixed(1)+'%');_st('pvrStatPodRate',(p/t*100).toFixed(1)+'%');_st('pvrStatNSRate',(n/t*100).toFixed(1)+'%');_st('pvrStatYears',Math.min(...yrs)+'–'+Math.max(...yrs));}
window.pvrSetTab=function(t){_tab=t;['dist','season','rally'].forEach(id=>{const b=document.getElementById('pvrTab-'+id),p=document.getElementById('pvrPane-'+id);if(b)b.classList.toggle('active',id===t);if(p)p.style.display=id===t?'block':'none';});if(t==='dist'&&_barChart)setTimeout(()=>_barChart.resize(),50);if(t==='season'&&_lineChart)setTimeout(()=>_lineChart.resize(),50);};
function _buildHeatTable(){const tb=document.getElementById('pvrHeatBody');if(!tb) return;const keys=['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','P11plus','NoScore'];const maxP={};keys.forEach(k=>{maxP[k]=Math.max(..._data.paceDist.map(d=>d.pcts[k]||0));});tb.innerHTML=_data.paceDist.map(row=>{const cells=keys.map(k=>{const cnt=row.counts[k]||0,pct=row.pcts[k]||0;if(!cnt)return '<td style="color:rgba(255,255,255,0.18);">—</td>';const a=(0.08+(maxP[k]>0?pct/maxP[k]:0)*0.58).toFixed(2);const rgb=k==='P1'?'255,215,0':k==='P2'||k==='P3'?'76,175,80':k==='NoScore'?'244,67,54':k==='P11plus'?'255,152,0':'2,218,205';return '<td><span class="pvr-heat-cell" style="background:rgba('+rgb+','+a+');color:rgba('+rgb+',1);" onclick="pvrDrillDown(\''+row.rank+'\',\''+k+'\')" title="Click to see instances">'+cnt+'<small style="font-weight:400;opacity:0.75;margin-left:2px;">'+(pct*100).toFixed(0)+'%</small></span></td>';});return '<tr><td><span class="pvr-rank-badge">'+row.rank+'</span></td><td style="color:var(--color-text-light);">'+row.n+'</td>'+cells.join('')+'</tr>';}).join('');}
window.pvrDrillDown=function(rank,finKey){const rankNum=parseInt(rank.replace('#',''));const instances=[];Object.keys(seasonsData).map(Number).sort().forEach(yr=>{const sd=seasonsData[yr];if(!sd||!sd.rallies)return;sd.rallies.forEach((rkey,ri)=>{const sKey=rkey+'_s',sc=sd.drivers.map(d=>d[sKey]).filter(v=>v!=null&&typeof v==='number');if(!sc.length)return;const tot=Math.max(...sc);const elig=sd.drivers.filter(d=>d[rkey]!=null&&d[sKey]!=null&&d[sKey]>=tot*0.4).sort((a,b)=>a[rkey]-b[rkey]);if(elig.length<rankNum)return;const d=elig[rankNum-1],fin=pvrFinishNum(d[rkey+'_r']),raw=d[rkey+'_r'];let match=false;if(finKey==='NoScore')match=(fin===null||raw===null||raw===undefined||(typeof raw==='string'&&isNaN(parseInt(raw))));else if(finKey==='P11plus')match=(fin!==null&&fin>10);else match=(fin===parseInt(finKey.replace('P','')));if(match)instances.push({year:yr,rally:sd.rallyNames[ri]||rkey,driver:d.name,finish:raw,skm:d[rkey],stages:d[sKey],total:tot});});});const label=finKey==='P11plus'?'P11+':finKey;document.getElementById('pvrDrillTitle').textContent='Pace '+rank+' \u2192 '+label+'  ('+instances.length+' instances)';document.getElementById('pvrDrillBody').innerHTML=instances.length?instances.map(r=>{const fn=pvrFinishNum(r.finish),fc=fn===1?'#ffd700':fn!==null&&fn<=3?'#4caf50':'var(--color-text)';return '<tr><td>'+r.year+'</td><td>'+r.rally+'</td><td style="font-weight:600;">'+r.driver+'</td><td style="font-weight:800;color:'+fc+';">'+(r.finish!=null?r.finish:'DNF')+'</td><td style="color:var(--color-text-light);">'+(r.skm!=null?r.skm.toFixed(3)+' s/km':'—')+'</td><td style="color:rgba(255,255,255,0.35);font-size:0.75rem;">'+r.stages+'/'+r.total+' stg</td></tr>';}).join(''):'<tr><td colspan="6" style="color:var(--color-text-light);padding:1rem;text-align:center;">No instances</td></tr>';const card=document.getElementById('pvrDrillCard');card.style.display='block';card.scrollIntoView({behavior:'smooth',block:'nearest'});};
function _buildBarChart(){const ctx=document.getElementById('pvrRankBarChart');if(!ctx||!window.Chart)return;if(_barChart){_barChart.destroy();_barChart=null;}const lbls=_data.paceDist.map(d=>d.rank),win=_data.paceDist.map(d=>+(d.pcts.P1*100).toFixed(1)),pod=_data.paceDist.map(d=>+((d.pcts.P1+d.pcts.P2+d.pcts.P3)*100).toFixed(1)),nos=_data.paceDist.map(d=>+(d.pcts.NoScore*100).toFixed(1));_barChart=new Chart(ctx,{type:'bar',data:{labels:lbls,datasets:[{label:'No Score %',data:nos,backgroundColor:'rgba(244,67,54,0.3)',borderColor:'rgba(244,67,54,0.75)',borderWidth:1},{label:'Podium %',data:pod,backgroundColor:'rgba(76,175,80,0.3)',borderColor:'rgba(76,175,80,0.75)',borderWidth:1},{label:'Win %',data:win,backgroundColor:'rgba(255,215,0,0.5)',borderColor:'rgba(255,215,0,0.9)',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'top'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y+'%'}}},scales:{x:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'rgba(210,218,232,0.9)'}},y:{beginAtZero:true,max:100,grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'rgba(210,218,232,0.9)',callback:v=>v+'%'}}}}});}
function _buildSeasonTable(){window.pvrSortSeason=function(k){_ssSort=_ssSort.k===k?{k,asc:!_ssSort.asc}:{k,asc:k!=='year'};_renderSeasonRows();};_renderSeasonRows();}
function _renderSeasonRows(){const tb=document.getElementById('pvrSeasonBody');if(!tb)return;const data=[..._data.seasonSummary].sort((a,b)=>{let av=a[_ssSort.k]??0,bv=b[_ssSort.k]??0;return _ssSort.asc?av-bv:bv-av;});const maxW=Math.max(...data.map(d=>d.win_pct||0)),curYr=_data.currentYear;tb.innerHTML=data.map(r=>{const wp=(r.win_pct*100).toFixed(0)+'%',pp=(r.podium_pct*100).toFixed(0)+'%',np=(r.noscore_pct*100).toFixed(0)+'%',bar='<span class="pvr-bar-inline" style="width:'+(r.win_pct/maxW*72).toFixed(0)+'px;"></span>',wc=r.win_pct>=0.7?'#4caf50':r.win_pct>=0.5?'var(--color-text)':'#f44336',live=r.year===curYr?' <span style="font-size:0.65rem;color:var(--color-primary);font-weight:600;border:1px solid var(--color-primary);border-radius:3px;padding:0 4px;">LIVE</span>':'';return '<tr'+(r.year===curYr?' style="background:rgba(2,218,205,0.05);"':'')+'>'+['<td style="font-weight:700;">'+r.year+live+'</td>','<td style="color:var(--color-text-light);">'+r.rallies+'</td>','<td style="font-weight:700;color:var(--color-primary);">'+r.pace_win+'</td>','<td style="font-weight:700;color:'+wc+';">'+wp+bar+'</td>','<td style="color:#4caf50;">'+pp+'</td>','<td style="color:#f44336;">'+np+'</td>'].join('')+'</tr>';}).join('');}
function _buildLineChart(){const ctx=document.getElementById('pvrSeasonLineChart');if(!ctx||!window.Chart)return;if(_lineChart){_lineChart.destroy();_lineChart=null;}const sorted=[..._data.seasonSummary].sort((a,b)=>a.year-b.year),lbls=sorted.map(d=>String(d.year)),win=sorted.map(d=>+(d.win_pct*100).toFixed(1)),pod=sorted.map(d=>+(d.podium_pct*100).toFixed(1)),nos=sorted.map(d=>+(d.noscore_pct*100).toFixed(1));_lineChart=new Chart(ctx,{type:'line',data:{labels:lbls,datasets:[{label:'No Score %',data:nos,borderColor:'rgba(244,67,54,0.75)',backgroundColor:'rgba(244,67,54,0.06)',tension:0.35,fill:true,pointRadius:3,borderWidth:2,spanGaps:true},{label:'Podium %',data:pod,borderColor:'rgba(76,175,80,0.8)',backgroundColor:'rgba(76,175,80,0.06)',tension:0.35,fill:true,pointRadius:3,borderWidth:2,spanGaps:true},{label:'Win %',data:win,borderColor:'rgba(255,215,0,0.9)',backgroundColor:'rgba(255,215,0,0.07)',tension:0.35,fill:true,pointRadius:4,borderWidth:2,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'top'},tooltip:{mode:'index',intersect:false,callbacks:{label:c=>c.dataset.label+': '+c.parsed.y+'%'}}},scales:{x:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'rgba(210,218,232,0.9)',maxRotation:45,autoSkip:true,maxTicksLimit:20}},y:{beginAtZero:true,max:110,grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'rgba(210,218,232,0.9)',callback:v=>v+'%'}}}}});}
function _populateRallyFilters(){const years=[...new Set(_data.rallyRows.map(r=>r.year))].sort((a,b)=>b-a),rallies=[...new Set(_data.rallyRows.map(r=>r.rally))].sort(),results=[...new Set(_data.rallyRows.map(r=>r.result))].sort();const ys=document.getElementById('pvrYearFilter'),rs=document.getElementById('pvrRallyFilter'),re=document.getElementById('pvrResultFilter');if(ys){ys.innerHTML='<option value="">All Years</option>';years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;ys.appendChild(o);});}if(rs){rs.innerHTML='<option value="">All Rallies</option>';rallies.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;rs.appendChild(o);});}if(re){re.innerHTML='<option value="">All Results</option>';results.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;re.appendChild(o);});}}
function _fstat(val,lbl,color,pct){return '<div class="pvr-fstat"><span class="pvr-fstat-val" style="color:'+color+';">'+val+'</span><span class="pvr-fstat-lbl">'+lbl+'</span><div class="pvr-fstat-bar-wrap"><div class="pvr-fstat-bar-fill" style="width:'+pct+'%;background:'+color+';opacity:0.7;"></div></div></div>';}
function _updateFilterStats(data){const el=document.getElementById('pvrFilterStats');if(!el) return;const n=data.length;if(n===0){el.style.display='none';return;}const wins=data.filter(r=>r.result==='Win').length,pods=data.filter(r=>r.result==='Win'||r.result==='Podium').length,pts=data.filter(r=>r.result==='Points').length,nos=data.filter(r=>r.result==='No Score').length,wp=+(wins/n*100).toFixed(1),pp=+(pods/n*100).toFixed(1),ptp=+(pts/n*100).toFixed(1),nsp=+(nos/n*100).toFixed(1);const yr=document.getElementById('pvrYearFilter')?.value||'',ral=document.getElementById('pvrRallyFilter')?.value||'',drv=(document.getElementById('pvrDriverFilter')?.value||'').trim(),res=document.getElementById('pvrResultFilter')?.value||'';const parts=[];if(ral)parts.push(ral);if(yr)parts.push(yr);if(drv)parts.push(drv);if(res)parts.push(res);const ctxLabel=parts.length?parts.join(' \u00b7 '):'All Rallies';el.style.display='flex';el.innerHTML='<span class="pvr-filter-stats-label">'+ctxLabel+' <span style="font-weight:400;opacity:0.55;">('+n+' rall'+(n===1?'y':'ies')+')</span></span>'+_fstat(wins+' / '+n,'Wins','#ffd700',wp)+_fstat(wp+'%','Win Rate','#ffd700',wp)+_fstat(pods+' / '+n,'Podiums','#4caf50',pp)+_fstat(pp+'%','Podium Rate','#4caf50',pp)+_fstat(pts+' / '+n,'Points','rgba(2,218,205,1)',ptp)+_fstat(nsp+'%','No Score Rate','#f44336',nsp);}
window.pvrRenderRallyTable=function(){if(!_data)return;const yr=document.getElementById('pvrYearFilter')?.value||'',res=document.getElementById('pvrResultFilter')?.value||'',ral=document.getElementById('pvrRallyFilter')?.value||'',drv=(document.getElementById('pvrDriverFilter')?.value||'').toLowerCase().trim();let data=_data.rallyRows.filter(r=>{if(yr&&String(r.year)!==yr)return false;if(res&&r.result!==res)return false;if(ral&&r.rally!==ral)return false;if(drv&&!r.paceLeader.toLowerCase().includes(drv))return false;return true;});data=[...data].sort((a,b)=>{let av=a[_rdSort.k],bv=b[_rdSort.k];if(typeof av==='string')av=av.toLowerCase();if(typeof bv==='string')bv=bv.toLowerCase();if(av==null)av=_rdSort.asc?'\uffff':-1;if(bv==null)bv=_rdSort.asc?'\uffff':-1;return _rdSort.asc?(av>bv?1:av<bv?-1:0):(av<bv?1:av>bv?-1:0);});_updateFilterStats(data);const cnt=document.getElementById('pvrRallyCount');if(cnt)cnt.textContent=data.length+' '+(data.length===1?'rally':'rallies');const tb=document.getElementById('pvrRallyBody');if(!tb)return;const badges={Win:'<span class="pvr-result-win">Win</span>',Podium:'<span class="pvr-result-podium">Podium</span>','No Score':'<span class="pvr-result-noscore">No Score</span>',Points:'<span class="pvr-result-points">Points</span>'};tb.innerHTML=data.map(r=>{const badge=badges[r.result]||'<span class="pvr-result-other">'+r.result+'</span>',skm=r.paceSKM!=null?r.paceSKM.toFixed(3):'—',pf=r.paceFinish!=null?r.paceFinish:'—',fn=pvrFinishNum(r.paceFinish),pfCol=fn===1?'color:#ffd700;font-weight:800;':fn!==null&&fn<=3?'color:#4caf50;font-weight:700;':'',tip='title="'+r.paceStages+'/'+r.totalStages+' stages ('+(r.paceStages/r.totalStages*100).toFixed(0)+'%)"';return '<tr><td>'+r.year+'</td><td>'+r.rally+'</td><td style="font-weight:600;" '+tip+'>'+r.paceLeader+'</td><td style="color:var(--color-text-light);font-size:0.78rem;">'+skm+'</td><td style="'+pfCol+'">'+pf+'</td><td>'+badge+'</td><td style="color:var(--color-text-light);">'+r.rallyWinner+'</td><td><span class="pvr-rank-badge">'+r.winnerPaceRank+'</span></td></tr>';}).join('')||'<tr><td colspan="8" style="color:var(--color-text-light);padding:1.5rem;text-align:center;">No results match your filters</td></tr>';};
window.pvrSortRally=function(k){_rdSort=_rdSort.k===k?{k,asc:!_rdSort.asc}:{k,asc:true};pvrRenderRallyTable();};
window.pvrResetRallyFilters=function(){['pvrYearFilter','pvrResultFilter','pvrRallyFilter'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});const di=document.getElementById('pvrDriverFilter');if(di)di.value='';_rdSort={k:'_idx',asc:true};pvrRenderRallyTable();};
