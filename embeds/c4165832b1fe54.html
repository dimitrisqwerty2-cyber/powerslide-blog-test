  body,html{margin:0;padding:0;height:100%;font-family:'WRC Clean Roman',sans-serif;background:#1c1c1c;overflow:hidden;}
  #map{width:100%;height:100%;background:#0a0a0a;}
  /* Dark basemap: OSM raster tiles inverted in CSS. CARTO's dark_all now
     stamps 'API KEY REQUIRED' over keyless requests, so we build the black
     style locally instead of depending on a keyed tile service. sepia+hue-rotate
     collapses the map to a single navy hue so no stray greens survive. */
  .leaflet-layer.dark-basemap-tiles { filter: invert(1) sepia(1) hue-rotate(170deg) saturate(.75) brightness(.72) contrast(1.1); }

  .leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#666!important;}
  .leaflet-control-zoom a{background:#222!important;color:#aaa!important;border-color:#333!important;}
  #ch{position:absolute;z-index:9999;pointer-events:none;display:none;flex-direction:column;align-items:center;transform:translate(-50%,calc(-100% - 14px));}
  #ch .b{background:rgba(15,15,15,.97);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;max-width:180px;white-space:normal;box-shadow:0 4px 16px rgba(0,0,0,.8);}
  #ch .t{font-weight:700;font-size:12px;margin-bottom:3px;font-family:'WRC Clean Bold',sans-serif;}
  #ch .d{font-size:11px;color:#aaa;line-height:1.3;margin-bottom:4px;}
  #ch .m{font-size:11px;color:#888;}
  #ch .m span{color:#02dacd;font-weight:700;}
  #ch .l{width:2px;height:14px;}
  .leaflet-tooltip.poi-tt{background:rgba(15,15,15,.97);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;color:#fff;font-family:'WRC Clean Roman',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.8);pointer-events:none;max-width:180px;white-space:normal;width:180px;}
  .leaflet-tooltip.poi-tt::before{display:none;}
  .poi-tt .t{font-weight:700;font-size:12px;margin-bottom:3px;font-family:'WRC Clean Bold',sans-serif;}
  .poi-tt .d{font-size:11px;color:#aaa;line-height:1.3;margin-bottom:4px;}
  .poi-tt .m{font-size:11px;color:#888;}
  .poi-tt .m span{color:#02dacd;font-weight:700;}
  @media(max-width:600px){
    #ch .b{max-width:140px;padding:6px 8px;}
    #ch .t{font-size:11px!important;}#ch .d{font-size:10px!important;}#ch .m{font-size:10px!important;}
    .leaflet-tooltip.poi-tt{max-width:140px;width:140px;padding:6px 8px;}
    .poi-tt .t{font-size:11px;}.poi-tt .d{font-size:10px;}.poi-tt .m{font-size:10px;}
  }
.leaflet-popup.poi-tt .leaflet-popup-content-wrapper { background:rgba(15,15,15,.97); border:1px solid rgba(255,255,255,.12); border-radius:6px; padding:8px; color:#fff; box-shadow:0 4px 16px rgba(0,0,0,.8); }
.leaflet-popup.poi-tt .leaflet-popup-tip-container { margin-top:-1px; }
.leaflet-popup.poi-tt .leaflet-popup-tip { background:rgba(15,15,15,.97); border:1px solid rgba(255,255,255,.12); border-top:none; border-left:none; }
.leaflet-popup.poi-tt .leaflet-popup-content { margin:0 !important; line-height:1.4; width:160px !important; font-family:'WRC Clean Roman',sans-serif; }
@media(max-width:600px){ .leaflet-popup.poi-tt .leaflet-popup-content { width:140px !important; } }

  .map-style-switcher { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 4px; background: rgba(0,0,0,0.55); padding: 5px; border-radius: 8px; }
  .map-style-btn { background: #333; color: #ccc; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; font-family: 'WRC Clean Roman', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; white-space:nowrap; }
  .map-style-btn.active { background: #fc4d03; border-color: #fc4d03; color: #fff; }
  @media(max-width:600px){
    .map-style-switcher { top:8px; right:8px; gap:3px; padding:3px; }
    .map-style-btn { padding:4px 6px; font-size:9px; border-radius:4px; }
  }
  @media(max-width:400px){
    .map-style-switcher { gap:2px; padding:2px; }
    .map-style-btn { padding:3px 5px; font-size:8px; }
  }

  #stage-info { position:absolute; top:14px; left:52px; z-index:1000; min-width:220px; max-width:330px; padding:12px 14px; color:#fff; background:rgba(10,10,10,.88); border:1px solid rgba(255,255,255,.17); border-left:4px solid #fc4d03; border-radius:3px; box-shadow:0 4px 18px rgba(0,0,0,.45); pointer-events:none; }
  #stage-info .event { color:#bdbdbd; font-size:10px; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  #stage-info .title { font-family:'WRC Clean Bold',sans-serif; font-size:20px; line-height:1.05; letter-spacing:.2px; }
  #stage-info .facts { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  #stage-info .fact { padding:3px 6px; border-radius:2px; background:rgba(255,255,255,.11); color:#e8e8e8; font-size:10px; font-family:'WRC Clean Bold',sans-serif; letter-spacing:.35px; text-transform:uppercase; }
  #stage-info .fact.surface { color:#fc4d03; }
  @media(max-width:600px){
    #stage-info { top:8px; left:8px; min-width:0; max-width:min(62vw,240px); padding:7px 9px; border-left-width:3px; }

    #stage-info .event{font-size:8px; margin-bottom:2px;}

  .mp-fplay::after { content:''; border-left:13px solid #fff; border-top:8px solid transparent; border-bottom:8px solid transparent; margin-left:3px; }

  .stage-tab { background:#222; color:#ccc; border:1px solid #444; padding:6px 12px; border-radius:6px; font-family:'WRC Clean Bold',sans-serif; font-size:11px; letter-spacing:.3px; white-space:nowrap; cursor:pointer; transition:background .25s ease,color .25s ease,border-color .25s ease,transform .2s ease; }

  .stage-tab.active { background:#fc4d03; border-color:#fc4d03; color:#fff; transform:translateY(-2px); }

let currentStageSectors = [];
const stageGroups = []; // {label, bounds, dist}
const drawSF = (stageSecs, isMain) => {
  if(!stageSecs.length) return;
  const sPt = stageSecs[0].coords[0];
  const fPt = stageSecs[stageSecs.length-1].coords[stageSecs[stageSecs.length-1].coords.length-1];
  const stageLabel = stageSecs[0].stageLabel || stageSecs[0].name || 'Stage';
  const labelIcon=L.divIcon({className:'stage-label',html:'<div style="display:inline-block;overflow:visible;background:rgba(10,10,10,.9);color:#fff;border-left:3px solid #fc4d03;border-radius:2px;padding:3px 6px;white-space:nowrap;font-family:WRC Clean Bold,sans-serif;font-size:10px;box-shadow:0 2px 5px rgba(0,0,0,.55)">'+stageLabel+'</div>',iconSize:[300,28],iconAnchor:[-13,34]});
  L.marker(sPt,{icon:labelIcon,interactive:false,zIndexOffset:850}).addTo(map);

  if (isMain) {
    L.marker(sPt,{icon:mkI('<div style="background:#4caf50;color:#fff;width:18px;height:18px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;box-shadow:0 0 8px rgba(0,0,0,.6)">S</div>'),interactive:false,zIndexOffset:1000}).addTo(map);
    L.marker(fPt,{icon:mkI('<div style="background:#fff;color:#000;width:18px;height:18px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 0 8px rgba(0,0,0,.6)">🏁</div>'),interactive:false,zIndexOffset:1000}).addTo(map);
  } else {
    L.marker(sPt,{icon:mkSm('<div style="background:#4caf50;color:#fff;width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:bold;opacity:0.8">S</div>'),interactive:false,zIndexOffset:900}).addTo(map);
    L.marker(fPt,{icon:mkSm('<div style="background:#fff;color:#000;width:14px;height:14px;border-radius:50%;border:1.5px solid #000;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:bold;opacity:0.8">🏁</div>'),interactive:false,zIndexOffset:900}).addTo(map);
  }

  const gBounds = L.latLngBounds();
  stageSecs.forEach(sec=>sec.coords.forEach(c=>gBounds.extend([c.lat,c.lng])));
  const gIdx = stageGroups.length;
  stageSecs.forEach(sec=>{ sec.__stageIdx = gIdx; });
  stageSecs[0].__isStageStart = true; // no split tick here — the S marker owns this point
  stageGroups.push({label: stageLabel, bounds: gBounds, dist: stageSecs.reduce((n,s)=>n+(parseFloat(s.dist)||0),0)});
};

let isFirstStage = true;
sectors.forEach(sec => {
  if (sec.id === 0 && currentStageSectors.length > 0) {
    drawSF(currentStageSectors, isFirstStage);
    isFirstStage = false;
    currentStageSectors = [];
  }
  currentStageSectors.push(sec);
});
if(currentStageSectors.length > 0) drawSF(currentStageSectors, isFirstStage);
const stageLayerGroups = stageGroups.map(()=>[]);

sectors.forEach((sec,si)=>{
  const ll=sec.coords.map(p=>[p.lat,p.lng]);ll.forEach(x=>bounds.extend(x));
  const glow=L.polyline(ll,{color:sec.color,weight:7.5,opacity:0.9,lineCap:'round',lineJoin:'round',interactive:false,smoothFactor:3.0}).addTo(map);
  const core=L.polyline(ll,{color:'#fff',weight:3,opacity:1,lineCap:'round',lineJoin:'round',interactive:false,smoothFactor:2.0}).addTo(map);
  const hit=L.polyline(ll,{color:'transparent',weight:30,opacity:0,lineCap:'round',lineJoin:'round',interactive:true,smoothFactor:2.0}).addTo(map);
  sLayers[si]={core,glow,hit};
  if(sec.__stageIdx!==undefined && stageLayerGroups[sec.__stageIdx]) stageLayerGroups[sec.__stageIdx].push({core,glow});
  const secVid = ytId(sec.video);
  if(!isTouch){
  hit.on('mouseover',e=>{if(selId!==si){glow.setStyle({weight:10,opacity:1});core.setStyle({weight:4});}showCH(e.originalEvent,sec);});
  hit.on('mousemove',e=>moveCH(e.originalEvent));
  hit.on('mouseout',()=>{if(selId!==si){glow.setStyle({weight:7.5,opacity:(selId===null)?0.9:0.3});core.setStyle({weight:3});}hideCH();});
  hit.on('click',e=>{L.DomEvent.stopPropagation(e.originalEvent);hideCH();sel(si);map.fitBounds(core.getBounds(),{padding:[20,20]});if(secVid)openMiniPlayer(secVid,sec.name);});
}else{
  const img = sec.photo ? '<img src="' + sec.photo + '" style="width:100%;border-radius:4px;margin-bottom:4px;display:block;max-height:180px;object-fit:contain;background:#111">' : '';
  const html = img + '<div class="t" style="color:' + sec.color + '">' + sec.name + '</div><div class="d">' + sec.desc + '</div><div class="m">Length <span>' + sec.dist + ' km</span></div>' + (secVid?watchBtnHtml(secVid,sec.name):'');
  hit.bindPopup(html, {className: 'poi-tt', closeButton: false, autoPan: false});
  hit.on('popupopen', ()=>{ sel(si); });
  hit.on('popupclose', ()=>{ sel(null); });
}
  if(!sec.__isStageStart&&ll.length>1)L.marker(ll[0],{icon:splitTickIcon(ll[0],ll[Math.min(3,ll.length-1)]),interactive:false,zIndexOffset:600}).addTo(map);
});
window.poiMarkers=[];
pois.forEach(poi=>{
  const pt = [poi.lat, poi.lng];
  const mk=L.marker(pt,{icon:poiDivIcon(poi.icon,poi.isMerged),zIndexOffset:poi.isMerged?650:700}).addTo(map); window.poiMarkers.push(mk);
  const pic=POI_ICONS[poi.icon]||POI_ICONS.spot;
  const img=poi.photo?'<img src="'+poi.photo+'" style="width:100%;border-radius:4px;margin-bottom:4px;display:block;max-height:180px;object-fit:contain;background:#111;">':'';
    const poiVid=ytId(poi.video);
    const body='<div class="t" style="color:'+pic.color+'">'+poi.title+'</div><div class="d">'+poi.desc+'</div><div class="m">Mark <span>'+poi.km+' km</span></div>';
    const phtml=img+body;
  if(!isTouch){
    mk.bindTooltip(phtml+(poiVid?'<div class="m" style="color:#ff4444">&#9654; Click to watch</div>':''),{className:'poi-tt',direction:'top',offset:[0,-12]});
    if(poiVid) mk.on('click',e=>{L.DomEvent.stopPropagation(e.originalEvent);openMiniPlayer(poiVid,poi.title);});
  }else{
    mk.bindPopup(phtml+(poiVid?watchBtnHtml(poiVid,poi.title):''),{className:'poi-tt',closeButton:false,offset:[0,-12],autoPan:false});
    mk.on('click',e=>{L.DomEvent.stopPropagation(e.originalEvent);mk.openPopup();});
  }
});
if(sectors.length>0)map.fitBounds(bounds,{padding:[20,20]});

if(stageGroups.length>1){
  const switcher=document.getElementById('stage-switcher');
  const infoBox=document.getElementById('stage-info');
  const infoTitle=infoBox.querySelector('.title'),infoFacts=infoBox.querySelector('.facts');
  const swapInfo=(html)=>{
    infoBox.classList.add('fade-swap');
    setTimeout(()=>{ infoTitle.innerHTML=html.title; infoFacts.innerHTML=html.facts; infoBox.classList.remove('fade-swap'); },180);
  };
  const setActive=(idx)=>{
    switcher.querySelectorAll('.stage-tab').forEach((btn,i)=>btn.classList.toggle('active', i===(idx===null?0:idx+1)));
    stageLayerGroups.forEach((layers,i)=>{
      const on = idx===null || i===idx;
      layers.forEach(({core,glow})=>{ core.setStyle({weight:on?4:3,opacity:on?1:0.3}); glow.setStyle({weight:on?10:7.5,opacity:on?1:0.28}); });
    });
    if(idx===null){
      swapInfo({title:"Shakedown",facts:'<span class="fact">'+stageMeta.distance+' km</span><span class="fact surface">'+stageGroups.length+' stages</span>'});
      map.flyToBounds(bounds,{padding:[20,20],duration:1.1,easeLinearity:0.25});
    } else {
      const g=stageGroups[idx];
      swapInfo({title:g.label,facts:'<span class="fact">'+g.dist.toFixed(2)+' km</span>'});
      map.flyToBounds(g.bounds,{padding:[40,40],duration:1.1,easeLinearity:0.25});
    }
  };
  const allBtn=document.createElement('button'); allBtn.type='button'; allBtn.className='stage-tab active'; allBtn.textContent='Overview'; allBtn.onclick=()=>setActive(null);
  switcher.appendChild(allBtn);
  stageGroups.forEach((g,i)=>{
    const btn=document.createElement('button'); btn.type='button'; btn.className='stage-tab'; btn.textContent=g.label; btn.onclick=()=>setActive(i);
    switcher.appendChild(btn);
  });
  switcher.style.display='flex';
  document.body.classList.add('has-switcher'); // lifts #stage-links clear of the tab bar
}
</script></body></html>
