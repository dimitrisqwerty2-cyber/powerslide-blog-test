const bounds=L.latLngBounds();
let fullCoords=[],cumDist=[0];
sectors.forEach(sec=>{sec.coords.forEach((c,i)=>{if(i===0&&fullCoords.length>0)return;fullCoords.push(c);});});
let tDist=0;
function gd(a,b,c,d){const R=6371,dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
for(let i=1;i<fullCoords.length;i++){tDist+=gd(fullCoords[i-1].lat,fullCoords[i-1].lng,fullCoords[i].lat,fullCoords[i].lng);cumDist.push(tDist);}

const ch=document.getElementById('ch'),ci=document.getElementById('ci'),ct=document.getElementById('ct'),cd=document.getElementById('cd'),cm=document.getElementById('cm'),cl=document.getElementById('cl');
function showCH(e,s){if(s.photo){ci.src=s.photo;ci.style.display='block';}else{ci.src='';ci.style.display='none';}ct.textContent=s.name;ct.style.color=s.color;cd.textContent=s.desc;cm.innerHTML='Length <span>'+s.dist+' km</span>';cl.style.background=s.color;moveCH(e);ch.style.display='flex';}
function moveCH(e){ch.style.left=e.clientX+'px';ch.style.top=e.clientY+'px';}
function hideCH(){ch.style.display='none';}
let selId=null,sLayers={};
map.on('click',()=>sel(null));
function sel(id){selId=id;sectors.forEach(sec=>{const l=sLayers[sec.id];if(!l)return;const on=(id===null||id===sec.id);l.core.setStyle({opacity:on?1:0.3});if(id===sec.id){l.glow.setStyle({weight:18,opacity:0.8});l.glow.bringToFront();l.core.bringToFront();l.hit.bringToFront();}else{l.glow.setStyle({weight:14,opacity:on?0.2:0.05});}});}

const mkI=h=>L.divIcon({className:'',html:h,iconSize:[26,26],iconAnchor:[13,13]});
const mkSm=h=>L.divIcon({className:'',html:h,iconSize:[20,20],iconAnchor:[10,10]});

// We trace stages by looking for id===0
let currentStageSectors = [];
const drawSF = (stageSecs, isMain) => {
  if(!stageSecs.length) return;
  const sPt = stageSecs[0].coords[0];
  const fPt = stageSecs[stageSecs.length-1].coords[stageSecs[stageSecs.length-1].coords.length-1];

  if (isMain) {
    L.marker(sPt,{icon:mkI('<div style="background:#4caf50;color:#fff;width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;box-shadow:0 0 8px rgba(0,0,0,.6)">S</div>'),interactive:false,zIndexOffset:1000}).addTo(map);
    L.marker(fPt,{icon:mkI('<div style="background:#fff;color:#000;width:26px;height:26px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 0 8px rgba(0,0,0,.6)">🏁</div>'),interactive:false,zIndexOffset:1000}).addTo(map);
  } else {
    L.marker(sPt,{icon:mkSm('<div style="background:#4caf50;color:#fff;width:20px;height:20px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;opacity:0.8">S</div>'),interactive:false,zIndexOffset:900}).addTo(map);
    L.marker(fPt,{icon:mkSm('<div style="background:#fff;color:#000;width:20px;height:20px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;opacity:0.8">🏁</div>'),interactive:false,zIndexOffset:900}).addTo(map);
  }
};

let isFirstStage = true;
sectors.forEach(sec => {
  if (sec.id === 0 && currentStageSectors.length > 0) {
    drawSF(currentStageSectors, isFirstStage);
    isFirstStage = false;
    currentStageSectors = [];
  }
  currentStageSectors.push(sec);
});
if(currentStageSectors.length > 0) drawSF(currentStageSectors, isFirstStage);

sectors.forEach(sec=>{
  const ll=sec.coords[0]&&Array.isArray(sec.coords[0])?sec.coords:sec.coords.map(p=>[p.lat,p.lng]);ll.forEach(x=>bounds.extend(x));
  const glow=L.polyline(ll,{color:sec.color,weight:14,opacity:0.2,lineCap:'round',lineJoin:'round',interactive:false,smoothFactor:3.0}).addTo(map);
  const core=L.polyline(ll,{color:'#fff',weight:4,opacity:1,lineCap:'round',lineJoin:'round',interactive:false,smoothFactor:2.0}).addTo(map);
  const hit=L.polyline(ll,{color:'transparent',weight:30,opacity:0,lineCap:'round',lineJoin:'round',interactive:true,smoothFactor:2.0}).addTo(map);
  sLayers[sec.id]={core,glow,hit};
  hit.on('mouseover',e=>{if(selId!==sec.id)glow.setStyle({weight:18,opacity:0.8});showCH(e.originalEvent,sec);});
  hit.on('mousemove',e=>moveCH(e.originalEvent));
  hit.on('mouseout',()=>{if(selId!==sec.id)glow.setStyle({weight:14,opacity:(selId===null)?0.2:0.05});hideCH();});
  hit.on('click',e=>{L.DomEvent.stopPropagation(e.originalEvent);hideCH();sel(sec.id);map.fitBounds(core.getBounds(),{padding:[20,20]});});
  if(sec.startIdx!==0)L.circleMarker(ll[0],{radius:4,fillColor:'#fff',color:'#000',weight:2,opacity:1,fillOpacity:1,interactive:false}).addTo(map);
});
pois.forEach(poi=>{
  const pt = [poi.lat, poi.lng];
  const mk=L.circleMarker(pt,{radius:6,fillColor:'#ffcc00',color:'#fff',weight:2,opacity:1,fillOpacity:1}).addTo(map);
  const img=poi.photo?'<img src="'+poi.photo+'" style="width:100%;border-radius:4px;margin-bottom:4px;display:block;max-height:85px;object-fit:cover;">':'';
    mk.bindTooltip(img+'<div class="t" style="color:#ffcc00">'+poi.title+'</div><div class="d">'+poi.desc+'</div><div class="m">Mark <span>'+poi.km+' km</span></div>',{className:'poi-tt',direction:'top',offset:[0,-8]});
});
if(sectors.length>0)map.fitBounds(bounds,{padding:[20,20]});
</script></body></html>
