  body,html{margin:0;padding:0;height:100%;font-family:'WRC Clean Roman',sans-serif;background:#1c1c1c;overflow:hidden;}
  #map{width:100%;height:100%;background:#0a0a0a;}
  /* Dark basemap: OSM raster tiles inverted in CSS. CARTO's dark_all now
     stamps 'API KEY REQUIRED' over keyless requests, so we build the black
     style locally instead of depending on a keyed tile service. sepia+hue-rotate
     collapses the map to a single navy hue so no stray greens survive. */
  .leaflet-layer.dark-basemap-tiles { filter: invert(1) sepia(1) hue-rotate(170deg) saturate(.75) brightness(.72) contrast(1.1); }

  .leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#666!important;}
  .leaflet-control-zoom a{background:#222!important;color:#aaa!important;border-color:#333!important;}
  #ch{position:absolute;z-index:9999;pointer-events:none;display:none;flex-direction:column;align-items:center;transform:translate(-50%,calc(-100% - 14px));}
  #ch .b{background:rgba(15,15,15,.97);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;max-width:180px;white-space:normal;box-shadow:0 4px 16px rgba(0,0,0,.8);}
  #ch .t{font-weight:700;font-size:12px;margin-bottom:3px;font-family:'WRC Clean Bold',sans-serif;}
  #ch .d{font-size:11px;color:#aaa;line-height:1.3;margin-bottom:4px;}
  #ch .m{font-size:11px;color:#888;}
  #ch .m span{color:#02dacd;font-weight:700;}
  #ch .l{width:2px;height:14px;}
  .leaflet-tooltip.poi-tt{background:rgba(15,15,15,.97);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;color:#fff;font-family:'WRC Clean Roman',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.8);pointer-events:none;max-width:180px;white-space:normal;width:180px;}
  .leaflet-tooltip.poi-tt::before{display:none;}
  .poi-tt .t{font-weight:700;font-size:12px;margin-bottom:3px;font-family:'WRC Clean Bold',sans-serif;}
  .poi-tt .d{font-size:11px;color:#aaa;line-height:1.3;margin-bottom:4px;}
  .poi-tt .m{font-size:11px;color:#888;}
  .poi-tt .m span{color:#02dacd;font-weight:700;}
  @media(max-width:600px){
    #ch .b{max-width:140px;padding:6px 8px;}
    #ch .t{font-size:11px!important;}#ch .d{font-size:10px!important;}#ch .m{font-size:10px!important;}
    .leaflet-tooltip.poi-tt{max-width:140px;width:140px;padding:6px 8px;}
    .poi-tt .t{font-size:11px;}.poi-tt .d{font-size:10px;}.poi-tt .m{font-size:10px;}
  }
.leaflet-popup.poi-tt .leaflet-popup-content-wrapper { background:rgba(15,15,15,.97); border:1px solid rgba(255,255,255,.12); border-radius:6px; padding:8px; color:#fff; box-shadow:0 4px 16px rgba(0,0,0,.8); }
.leaflet-popup.poi-tt .leaflet-popup-tip-container { margin-top:-1px; }
.leaflet-popup.poi-tt .leaflet-popup-tip { background:rgba(15,15,15,.97); border:1px solid rgba(255,255,255,.12); border-top:none; border-left:none; }
.leaflet-popup.poi-tt .leaflet-popup-content { margin:0 !important; line-height:1.4; width:160px !important; font-family:'WRC Clean Roman',sans-serif; }
@media(max-width:600px){ .leaflet-popup.poi-tt .leaflet-popup-content { width:140px !important; } }

  .map-style-switcher { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 4px; background: rgba(0,0,0,0.55); padding: 5px; border-radius: 8px; }
  .map-style-btn { background: #333; color: #ccc; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; font-family: 'WRC Clean Roman', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; white-space:nowrap; }
  .map-style-btn.active { background: #fc4d03; border-color: #fc4d03; color: #fff; }
  @media(max-width:600px){
    .map-style-switcher { top:8px; right:8px; gap:3px; padding:3px; }
    .map-style-btn { padding:4px 6px; font-size:9px; border-radius:4px; }
  }
  @media(max-width:400px){
    .map-style-switcher { gap:2px; padding:2px; }
    .map-style-btn { padding:3px 5px; font-size:8px; }
  }
  /* Full screen control - shares the top-right cluster with the basemap buttons */
  .map-fs-btn { display:flex; align-items:center; justify-content:center; padding:5px 8px; }
  .map-fs-btn:hover { background:#444; color:#fff; }
  .map-fs-btn.active { background:#fc4d03; border-color:#fc4d03; color:#fff; }
  .map-fs-btn svg { display:block; }
  @media(max-width:600px){ .map-fs-btn { padding:4px 6px; } }
  @media(max-width:400px){ .map-fs-btn { padding:3px 5px; } }

  /* ---- POI pin ---- */
  .poi-pin { position:relative; width:20px; height:20px; border-radius:50%; background:rgba(12,12,12,.92); border:2px solid var(--pc,#fff); box-shadow:0 2px 6px rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; transition:transform .18s ease; }

  /* ---- Click callout ----
     A leader line grows out of the pin at an angle and a panel unfolds at the end of it,
     the way a spot is annotated on a recce note. The whole thing is positioned in
     container pixels and re-pinned on every map move so it tracks the point. */

  .pc-line { position:absolute; height:2px; background:var(--pc,#fff); transform-origin:0 50%;
             width:0; border-radius:1px; box-shadow:0 0 8px rgba(0,0,0,.6);
             transition:width .28s cubic-bezier(.25,.85,.35,1);
             pointer-events:auto; cursor:pointer; }
  /* An invisible corridor around the hairline, so the cursor can follow the line from the

  .pc-line::before { content:''; position:absolute; left:-6px; right:-6px; top:-10px; bottom:-10px; }
  .pc-dot { position:absolute; width:7px; height:7px; margin:-3.5px 0 0 -3.5px; border-radius:50%;

  .pc-box { position:absolute; width:210px; background:rgba(10,10,10,.95); border:2px solid var(--pc,#fff);

            box-shadow:0 10px 30px rgba(0,0,0,.75);
            opacity:0; transform:scale(.82); transition:opacity .2s ease, transform .28s cubic-bezier(.2,.9,.3,1.2); }
  #poi-callout.show .pc-line { width:var(--len,96px); }
  #poi-callout.show .pc-dot  { opacity:1; }

<script>
/* Snapshot of this page exactly as it was served, taken before Leaflet touches the DOM.
   The fullscreen fallback re-writes it into a new tab when the host frame blocks the
   Fullscreen API, which is the only way to get a real full-window map out of a Google
   Sites embed - there our own location is Google's wrapper frame, not this file. */
const PAGE_SRC='<!DOCTYPE html>'+document.documentElement.outerHTML;
const map=L.map('map',{zoomControl:true,scrollWheelZoom:true,tap: true,preferCanvas:true}).setView([0,0],2);
const mapTileStyles = {
  dark: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19,className:'dark-basemap-tiles'}),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19}),
  plain: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19})
};
let currentMapStyle = 'dark';
mapTileStyles[currentMapStyle].addTo(map);
// the active pill is baked in at export time; re-sync it so a rebuilt copy of this
// page (see PAGE_SRC) highlights whichever basemap it actually opened with
document.querySelectorAll('#map-style-switcher .map-style-btn[data-style]').forEach(function(b){ b.classList.toggle('active', b.dataset.style===currentMapStyle); });
function setMapStyle(styleName){
  if(!mapTileStyles[styleName] || styleName===currentMapStyle) return;
  map.removeLayer(mapTileStyles[currentMapStyle]);
  currentMapStyle = styleName;
  mapTileStyles[currentMapStyle].addTo(map);
  document.querySelectorAll('#map-style-switcher .map-style-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.style===styleName);
  });
}
function decodePath(str){
  const pts=[]; let i=0, lat=0, lng=0;
  while(i<str.length){
    let b, shift=0, res=0;
    do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lat += (res&1)?~(res>>1):(res>>1);
    shift=0; res=0;
    do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lng += (res&1)?~(res>>1):(res>>1);
    pts.push({lat:lat/1e5, lng:lng/1e5});
  }
  return pts;

    if(idx===null){
      swapInfo({title:"SS15/17 · Sassari - Argentiera",facts:'<span class="fact">'+stageMeta.distance+' km</span><span class="fact surface">'+stageGroups.length+' stages</span>'});
      map.flyToBounds(bounds,{padding:[20,20],duration:1.1,easeLinearity:0.25});
    } else {
      const g=stageGroups[idx];
      swapInfo({title:g.label,facts:'<span class="fact">'+g.dist.toFixed(2)+' km</span>'});
      map.flyToBounds(g.bounds,{padding:[40,40],duration:1.1,easeLinearity:0.25});
    }
  };
  const allBtn=document.createElement('button'); allBtn.type='button'; allBtn.className='stage-tab active'; allBtn.textContent='Overview'; allBtn.onclick=()=>setActive(null);
  switcher.appendChild(allBtn);
  stageGroups.forEach((g,i)=>{
    const btn=document.createElement('button'); btn.type='button'; btn.className='stage-tab'; btn.textContent=g.label; btn.onclick=()=>setActive(i);
    switcher.appendChild(btn);
  });
  switcher.style.display='flex';
  document.body.classList.add('has-switcher'); // lifts #stage-links clear of the tab bar
}

/* ---- Full screen ----
   Inside an iframe the Fullscreen API only works when the embedding <iframe> carries
   allow="fullscreen" (or allowfullscreen). Google Sites' embed wrapper does not always
   pass that through, and iOS Safari has no element fullscreen at all, so when the API is
   blocked we fall back to opening this map at top level in a new tab. */
(function initFullscreen(){
  const btn=document.getElementById('fs-btn');
  if(!btn) return;
  const ICON_IN='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const ICON_OUT='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  const root=document.documentElement;
  const req=root.requestFullscreen||root.webkitRequestFullscreen||root.webkitRequestFullScreen||root.msRequestFullscreen;
  const exitFs=document.exitFullscreen||document.webkitExitFullscreen||document.webkitCancelFullScreen||document.msExitFullscreen;
  const flag=(document.fullscreenEnabled!==undefined)?document.fullscreenEnabled:document.webkitFullscreenEnabled;
  const canFS=!!req && flag!==false;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement||null;
  let toastT=0;
  function toast(msg){
    let t=document.getElementById('fs-toast');
    if(!t){ t=document.createElement('div'); t.id='fs-toast'; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},4500);
  }
  function paint(){
    const on=!!fsEl();
    btn.innerHTML=on?ICON_OUT:ICON_IN;
    btn.title=on?'Exit full screen':(canFS?'Full screen':'Open full screen in a new tab');
    btn.setAttribute('aria-label',btn.title);
    btn.classList.toggle('active',on);
    setTimeout(function(){map.invalidateSize();},150); // the map box just changed size
  }
  /* Our own URL is only worth reopening when this file really is the framed document.
     Inside a Google Sites embed we are running in Google's gadget wrapper, so its URL
     would open an empty shell - detect that and rebuild the map from PAGE_SRC instead. */
  function ownUrl(){
    try{
      if(location.protocol!=='http:'&&location.protocol!=='https:') return '';
      const host=(location.hostname||'').toLowerCase(), path=(location.pathname||'').toLowerCase();
      if(host.indexOf('googleusercontent.com')>-1) return '';   // Google Sites' gadget wrapper
      if(path.indexOf('/embed/')>-1||path.indexOf('/embeds/')>-1) return '';
      return location.href;
    }catch(_){ return ''; }
  }
  function writeSelfInto(w){
    let src=PAGE_SRC;
    // carry the basemap the viewer is actually looking at into the new tab
    try{ src=src.replace(/let currentMapStyle = '[a-z]+';/, "let currentMapStyle = '"+currentMapStyle+"';"); }catch(_){}
    w.document.open(); w.document.write(src); w.document.close();
  }
  function openTopLevel(){
    const url=ownUrl();
    let w=null;
    try{ w=window.open(url||'','_blank'); }catch(_){}
    if(!w){ toast('Allow pop-ups for this page to open the map full screen.'); return; }
    if(url) return;                       // the real file will load on its own
    try{ writeSelfInto(w); }
    catch(_){ try{ w.close(); }catch(__){} toast('This page could not open the map in a new tab.'); }
  }
  btn.addEventListener('click',function(e){
    e.preventDefault();
    if(fsEl()){ try{ exitFs.call(document); }catch(_){} return; }
    if(!canFS){ openTopLevel(); return; }
    let p;
    try{ p=req.call(root,{navigationUI:'hide'}); }catch(_){ openTopLevel(); return; }
    if(p&&typeof p.catch==='function') p.catch(openTopLevel);
  });
  ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(ev){document.addEventListener(ev,paint);});
  paint();
})();
</script></body></html>
