<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings after Rally Cyprus</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            text-align: center;
        }
        table {
            width: 70%;
            margin: 25px auto;
            border-collapse: collapse;
            font-size: 18px;
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #dddddd;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:nth-child(odd) {
            background-color: #ffffff;
        }
        img.flag {
            width: 30px;
            height: auto;
        }
    </style>
</head>
<body>

<h2>Standings after Rally Cyprus</h2>

<table>
    <tr>
        <th>Position</th>
        <th>Driver</th>
        <th>Team</th>
        <th>Points</th>
    </tr>
    <tr>
        <td>1</td>
        <td><img class="flag" src="https://flagcdn.com/w320/gb.png" alt="UK flag"> Richard Burns</td>
        <td>Peugeot</td>
        <td>37</td>
    </tr>
    <tr>
        <td>2</td>
        <td><img class="flag" src="https://flagcdn.com/w320/es.png" alt="Spain flag"> Carlos Sainz</td>
        <td>Citroën</td>
        <td>36</td>
    </tr>
    <tr>
        <td>3</td>
        <td><img class="flag" src="https://flagcdn.com/w320/fi.png" alt="Finland flag"> Marcus Gronholm</td>
        <td>Peugeot</td>
        <td>30</td>
    </tr>
    <tr>
        <td>4</td>
        <td><img class="flag" src="https://flagcdn.com/w320/no.png" alt="Norway flag"> Petter Solberg</td>
        <td>Subaru</td>
        <td>29</td>
    </tr>
    <tr>
        <td>5</td>
        <td><img class="flag" src="https://flagcdn.com/w320/ee.png" alt="Estonia flag"> Markko Martin</td>
        <td>Ford</td>
        <td>23</td>
    </tr>
    <tr>
        <td>=5</td>
        <td><img class="flag" src="https://flagcdn.com/w320/fr.png" alt="France flag"> Sebastien Loeb</td>
        <td>Citroën</td>
        <td>23</td>
    </tr>
</table>

</body>
</html>
